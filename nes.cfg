SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300;
}

MEMORY {
    ZP:         file = "", start = $0000, size = $0100;
    RAM:        file = "", start = $0300, size = $0500;
    SRAM:       file = "", start = $6000, size = $2000;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;

    # PRG-ROM banks (adjust count and size to match your ROM)
    # Using MMC3 PRG Mode 0 ($8000-$9FFF and $A000-$BFFF swappable, $C000-$FFFF fixed to last bank)
    PRG_BANK0:  file = %O, start = $8000, size = $2000, fill = yes, define = yes;
    PRG_BANK1:  file = %O, start = $A000, size = $2000, fill = yes, define = yes;
    PRG_BANK2:  file = %O, start = $8000, size = $2000, fill = yes, define = yes;
    PRG_BANK3:  file = %O, start = $8000, size = $2000, fill = yes, define = yes;
    PRG_FIXED:  file = %O, start = $C000, size = $4000, fill = yes, define = yes;
}

SEGMENTS {
    ZEROPAGE:   load = ZP,        type = zp;
    BSS:        load = RAM,       type = bss, define = yes;
    SRAM:       load = SRAM,      type = bss, optional = yes;
    HEADER:   load = HEADER,          type = ro;

    # Swappable PRG segments
    BANK0:      load = PRG_BANK0, type = ro,  optional = yes;
    BANK1:      load = PRG_BANK1, type = ro,  optional = yes;
    BANK2:      load = PRG_BANK2, type = ro,  optional = yes;
    BANK3:      load = PRG_BANK3, type = ro,  optional = yes;

    # Fixed PRG segment ($C000 - $FFFF) containing startup code, main loop, and vectors
    STARTUP:    load = PRG_FIXED, type = ro,  start = $E000;
    CODE:       load = PRG_FIXED, type = ro;
    RODATA:     load = PRG_FIXED, type = ro;
    DATA:       load = PRG_FIXED, type = rw,  run = RAM;
    VECTORS:    load = PRG_FIXED, type = ro,  start = $FFFA;
}